<!DOCTYPE html>
<html lang="ja">
  <head>

          media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/images/splash-1284x2778.png"

    <link rel="apple-touch-startup-image" href="/images/splash-1170x2532.png"
          media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/images/splash-1125x2436.png"
          media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/images/splash-828x1792.png"

    <link rel="apple-touch-startup-image" href="/images/splash-750x1334.png"
          media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <!-- SEO / OGP -->
    <meta name="description" content="お近くのお店からお得なおすそわけバッグをゲットしよう。毎日更新されるサプライズバッグで、美味しさをおすそわけ。" />
    <meta property="og:title" content="おすそわけ - ご近所のお店からおトクにシェア" />
    <meta property="og:description" content="お近くのお店からお得なサプライズバッグをゲットしよう" />

    <!-- Fonts: Noto Sans JP (body) + Outfit (display) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">

    <!-- Google Maps 用の事前接続: 地図ページの初回表示を高速化 (DNS/TLS を先行) -->
    <link rel="preconnect" href="https://maps.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://maps.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://maps.googleapis.com">

    <!-- Favicon -->

  <body>
    <!--
      ★ 起動時スプラッシュ (白画面対策)
      JS/CSS バンドルが download → parse → React 初回描画する間、
      何もないと真っ白な画面が長く見えてしまう。
      HTML 内にインラインでロゴを置いておくことで、 サーバーから index.html が
      返った瞬間に表示される。 React マウント (#root に子要素が入る) を検知して
      自動で fade out → 完全消滅させる。
    -->
    <style>
      /* ★ Web 側の初回ペイントをクリームに固定 (白/黒フラッシュ防止)。
         WebView 背景 (#FBF8F4) / ネイティブ LaunchScreen とも同色でシームレス。 */
      html, body { margin: 0; padding: 0; background: #FBF8F4; }
      #__splash {
        position: fixed; inset: 0; z-index: 999999;
        display: flex; align-items: center; justify-content: center;
        background: #FBF8F4;
        transition: opacity .35s ease-out;
        pointer-events: none;
      }
      #__splash.__hide { opacity: 0; }
      /* ★ ネイティブ (LaunchScreen.storyboard / MainViewController) と完全一致させる。
         ネイティブは正方形 Splash 画像 (cream 背景 + 中央ロゴ) を scaleAspectFit で
         全画面表示している。 Web も「同一の正方形画像」を object-fit:contain で全画面
         表示する → 画面上のロゴ位置・サイズがネイティブとピクセル完全一致。
         これで native→web ハンドオフ時に「ロゴが落ちる/ずれる/サイズが飛ぶ」が
         物理的に発生しない (同じ画像を同じ規則で描くだけなので差分ゼロ)。
         ※ 旧版は logo-192.png を 33vw 中央寄せしていたが、ネイティブ Splash 画像内で
           ロゴが縦中央より 13% 上にあったため、中央寄せの web と縦位置がズレて
           「下にストンと落ちる」現象が出ていた (2026-07-04 実測・修正)。 */
      #__splash img {
        width: 100%; height: 100%; object-fit: contain;
      }
    </style>
    <div id="__splash" aria-hidden="true">
      <img src="/images/splash-square.png" alt="" />
    </div>
    <script>
      // ★ ネイティブ StatusBar.overlaysWebView:false のため、WKWebView はステータスバー
      //   ストリップの「下」に配置され、画面より (screen.height - innerHeight) だけ縦に短い。
      //   #__splash は position:fixed;inset:0 でこの「短い WebView」の中央にロゴを置くため、
      //   真の画面中央より (screen.height - innerHeight)/2 px だけ下にずれる (実機で +80 device px)。
      //   ネイティブ LaunchScreen は全画面 (edge-to-edge) で真の 50% に描くので、web だけが下がる。
      //   → ロゴを同量だけ上へ平行移動し、ネイティブと画面上でピクセル一致させる。
      //   (実測 beacon: fixOff=27css → imgTop=-27 → logo center=437=874/2 で完全中央)
      (function () {
        var img = document.querySelector('#__splash img');
        if (!img) return;
        function center() {
          var off = Math.max(0, (window.screen.height - window.innerHeight) / 2);
          img.style.transform = 'translateY(' + (-off) + 'px)';
        }
        center();
        window.addEventListener('resize', center);
        window.addEventListener('orientationchange', center);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', center);
      })();
    </script>

    <div id="root"></div>
    <script>
      // ★ #root が DOM に存在した後に必ず実行 (この script タグは <div id="root"> の直後)。
      // React の createRoot が #root に最初の子を注入したら splash を消す。
      // タイマーフォールバック (8s) + 異常系の保険 (root 取得失敗でも強制 remove) も置く。
      (function () {
        var splash = document.getElementById('__splash');
        if (!splash) return;
        var removed = false;
        var hide = function () {
          if (removed) return;
          removed = true;
          splash.classList.add('__hide');
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 400);
        };
        var root = document.getElementById('root');
        if (root) {
          // 既にマウント済み (キャッシュ等) なら即 hide
          if (root.firstElementChild) { hide(); return; }
          var observer = new MutationObserver(function () {
            if (root.firstElementChild) { observer.disconnect(); hide(); }
          });
          observer.observe(root, { childList: true });
        }
        // どんな異常系 (root 取得失敗 / observer 不発火) でも 8 秒で強制消去
        setTimeout(hide, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // SW is only registered in production (not Replit dev proxy)
      if ('serviceWorker' in navigator && location.hostname !== 'localhost' && !location.hostname.includes('replit')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => console.log('[SW] registered:', reg.scope))
            .catch(err => console.warn('[SW] registration failed:', err));
        });
      }
    </script>
  </body>
</html>
