    <!-- Favicon
         ★ 旧: favicon.svg(ロゴ無しのピンク四角のみ) + favicon.ico 実体なし(SPAのHTMLが
           返っていた) → Google がアイコンを取得できず検索結果の表示が崩れていた。
         アプリアイコンと同じ絵柄の実体ファイル(ICO + 48倍数PNG=Google推奨)を配信する。 -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />

    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />

  <body>
    <!--
      ★ 起動時スプラッシュ (白画面対策)
      JS/CSS バンドルが download → parse → React 初回描画する間、
      何もないと真っ白な画面が長く見えてしまう。
      HTML 内にインラインでロゴを置いておくことで、 サーバーから index.html が
      返った瞬間に表示される。 React マウント (#root に子要素が入る) を検知して
      自動で fade out → 完全消滅させる。
    -->
    <style>
      /* ★ Web 側の初回ペイントをクリームに固定 (白/黒フラッシュ防止)。
         WebView 背景 (#FBF8F4) / ネイティブ LaunchScreen とも同色でシームレス。 */
      html, body { margin: 0; padding: 0; background: #FBF8F4; }
      #__splash {
        position: fixed; inset: 0; z-index: 999999;
        display: flex; align-items: center; justify-content: center;
        background: #FBF8F4;
        transition: opacity .35s ease-out;
        pointer-events: none;
      }
      #__splash.__hide { opacity: 0; }
      /* ★ ネイティブ (LaunchScreen.storyboard / MainViewController) と完全一致させる。
         ネイティブは正方形 Splash 画像 (cream 背景 + 中央ロゴ) を scaleAspectFit で
         全画面表示している。 Web も「同一の正方形画像」を object-fit:contain で全画面
         表示する → 画面上のロゴ位置・サイズがネイティブとピクセル完全一致。
         これで native→web ハンドオフ時に「ロゴが落ちる/ずれる/サイズが飛ぶ」が
         物理的に発生しない (同じ画像を同じ規則で描くだけなので差分ゼロ)。
         ※ 旧版は logo-192.png を 33vw 中央寄せしていたが、ネイティブ Splash 画像内で
           ロゴが縦中央より 13% 上にあったため、中央寄せの web と縦位置がズレて
           「下にストンと落ちる」現象が出ていた (2026-07-04 実測・修正)。 */
      #__splash img {
        width: 100%; height: 100%; object-fit: contain;
      }
    </style>
    <div id="__splash" aria-hidden="true">
      <img src="/images/splash-square.png" alt="" />
    </div>
    <script>
      // ★ ネイティブ StatusBar.overlaysWebView:false のため、WKWebView はステータスバー
      //   ストリップの「下」に配置され、画面より (screen.height - innerHeight) だけ縦に短い。
      //   #__splash は position:fixed;inset:0 でこの「短い WebView」の中央にロゴを置くため、
      //   真の画面中央より (screen.height - innerHeight)/2 px だけ下にずれる (実機で +80 device px)。
      //   ネイティブ LaunchScreen は全画面 (edge-to-edge) で真の 50% に描くので、web だけが下がる。
      //   → ロゴを同量だけ上へ平行移動し、ネイティブと画面上でピクセル一致させる。
      //   (実測 beacon: fixOff=27css → imgTop=-27 → logo center=437=874/2 で完全中央)
      (function () {
        var img = document.querySelector('#__splash img');
        if (!img) return;
        function center() {
          var off = Math.max(0, (window.screen.height - window.innerHeight) / 2);
          img.style.transform = 'translateY(' + (-off) + 'px)';
        }
        center();
        window.addEventListener('resize', center);
        window.addEventListener('orientationchange', center);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', center);
      })();
    </script>

    <div id="root"></div>
    <script>
      // ★ #root が DOM に存在した後に必ず実行 (この script タグは <div id="root"> の直後)。
      // React の createRoot が #root に最初の子を注入したら splash を消す。
      // タイマーフォールバック (8s) + 異常系の保険 (root 取得失敗でも強制 remove) も置く。
      (function () {
        var splash = document.getElementById('__splash');
        if (!splash) return;
        var removed = false;
        var hide = function () {
          if (removed) return;
          removed = true;
          splash.classList.add('__hide');
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            // ★ web スプラッシュを DOM から「完全除去した後」に、iOS ネイティブ cover へ
            //   除去を許可する (MainViewController が coverOff を待って cover を外す)。
            //   この時点で画面の下地は React 本体のみ＝スプラッシュのロゴは存在しない。
            //   よって cover を外しても「落ちるロゴ」が物理的に無く、位置ズレに関係なく
            //   ドロップは構造的に発生しない。 cover 保持中(それまで)は web の初回描画も
            //   全て隠れているので、黒/白/ズレは一切見えない。
            //   非iOS (Android/PWA) では webkit.messageHandlers が無いので何も起きない。
            try {
              if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.coverOff) {
                window.webkit.messageHandlers.coverOff.postMessage('off');
              }
            } catch (e) {}
          }, 400);
        };
        var root = document.getElementById('root');
        if (root) {
          // 既にマウント済み (キャッシュ等) なら即 hide
          if (root.firstElementChild) { hide(); return; }
          var observer = new MutationObserver(function () {
            if (root.firstElementChild) { observer.disconnect(); hide(); }
          });
          observer.observe(root, { childList: true });
        }
        // どんな異常系 (root 取得失敗 / observer 不発火) でも 8 秒で強制消去
        setTimeout(hide, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // ★ 起動失敗の最終保険 (React マウント前の白画面対策):
      //   デプロイ直後に旧 index.html がキャッシュから返ると、参照するエントリチャンク
      //   (/assets/*.js) が 404 になり main.tsx が読めず React が一切マウントされない = 白画面。
      //   ErrorBoundary は React 内部なのでこの段階では効かない。
      //   → チャンク読込失敗 or 一定時間 #root が空 なら、キャッシュバスト付きで最新
      //     index.html を強制取得する (セッション1回だけ = 無限ループ防止)。
      (function () {
        var KEY = '__bootReloaded';
        function bustReload() {
          try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {}
          try {
            var u = new URL(window.location.href);
            u.searchParams.set('_cb', String(Date.now()));
            window.location.replace(u.toString());
          } catch (e) { window.location.reload(); }
        }
        // (a) スクリプト/スタイルの読込失敗 (チャンク 404) を捕捉 (capture フェーズ)
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            var src = t.src || t.href || '';
            if (src.indexOf('/assets/') !== -1) bustReload();
          }
        }, true);
        // (b) 10 秒経っても React がマウントしなければ (エントリ読込失敗の可能性) リロード
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && !root.firstElementChild) bustReload();
        }, 10000);
      })();
    </script>
    <script>
      // SW is only registered in production (not Replit dev proxy)
      if ('serviceWorker' in navigator && location.hostname !== 'localhost' && !location.hostname.includes('replit')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => console.log('[SW] registered:', reg.scope))
            .catch(err => console.warn('[SW] registration failed:', err));
        });

        // ★ 新しいデプロイを SW が検知したら、その場で最新を読み込み直す。
        //   旧実装は反映が「次回起動時」で、その間アプリは古い HTML のまま
        //   削除済み JS チャンクを 404 で引いて白画面になっていた。
        //   無限ループ防止に 1 分のクールダウンを置く。
        navigator.serviceWorker.addEventListener('message', (e) => {
          if (!e.data || e.data.type !== 'NEW_VERSION') return;
          try {
            var K = 'osusowake_sw_reload_at';
            var last = Number(sessionStorage.getItem(K) || 0);
            if (Date.now() - last < 60000) return;
            sessionStorage.setItem(K, String(Date.now()));
          } catch (_) {}
          var u = new URL(window.location.href);
          u.searchParams.set('_v', String(Date.now()));
          window.location.replace(u.toString());
        });
      }

      // ★★ CSS のプリロード失敗でページごと死ぬのを止める (2026-08-12)
      //   Vite が生成する読み込み処理は、遅延ページに紐づく CSS が 1 本でも取れないと
      //   【そのページの読み込み自体を失敗させる】。つまり CSS の 404 が白画面になる。
      //   実際、旧ビルドの JS が「存在しない CSS 名」を指しており、端末が 1 年キャッシュで
      //   その JS を掴んでいると、注文ページ等が永久に開かなくなる状態だった。
      //   本体の CSS は <link> で先に読み込まれているので、遅延分の 1 本が欠けても
      //   見た目はほぼ変わらない。ページが開かない方が圧倒的に害が大きいため握り潰す。
      //   ※ JS チャンクの失敗は下の unhandledrejection で従来どおり再読込する。
      window.addEventListener('vite:preloadError', function (ev) {
        var pm = String((ev && ev.payload && (ev.payload.message || ev.payload)) || '');
        if (/Unable to preload CSS/i.test(pm)) {
          if (ev.preventDefault) ev.preventDefault();
        }
      });

      // ★ 保険: 動的 import の失敗 (デプロイで消えたチャンクを 404 で引く) は
      //   Promise の unhandledrejection として飛び、React の ErrorBoundary では
      //   捕まらないことがある。ここで拾ってキャッシュバスト付きで再読込する。
      window.addEventListener('unhandledrejection', function (ev) {
        var m = String((ev && ev.reason && (ev.reason.message || ev.reason)) || '');
        var isChunkFail = /Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported module|Loading chunk .* failed/i.test(m);
        if (!isChunkFail) return;
        try {
          var K2 = 'osusowake_chunk_reload_at';
          var last2 = Number(sessionStorage.getItem(K2) || 0);
          if (Date.now() - last2 < 60000) return;
          sessionStorage.setItem(K2, String(Date.now()));
        } catch (_) {}
        var u2 = new URL(window.location.href);
        u2.searchParams.set('_cb', String(Date.now()));
        window.location.replace(u2.toString());
      });

      // ★★ アプリ復帰時の更新チェック (2026-08-06)
      //   店舗の端末はアプリを開きっぱなし/バックグラウンドのままで何日も使われるため、
      //   デプロイしても【古い画面のまま気づかない】ことが繰り返し起きていた
      //   (修正済みの表示崩れが「まだ直ってない」と報告される原因)。
      //   → 画面に戻ってきたタイミングでサーバーの最新 index.html を取得し、
      //     エントリJSのファイル名が変わっていたら、その場で最新に入れ替える。
      //   ・30秒以上離れていた時だけ実行 (通常操作では走らない)
      //   ・チェックは最短5分に1回 (通信の無駄打ち防止)
      //   ・リロードは1分のクールダウン付き (ループ防止)
      (function () {
        var running = '';
        try {
          var el = document.querySelector('script[type="module"][src*="/assets/index-"]');
          var m0 = el && el.src && el.src.match(/assets\/index-[A-Za-z0-9_-]+\.js/);
          if (m0) running = m0[0];
        } catch (_) {}
        if (!running) return; // 開発時 (/src/main.tsx) は対象外

        var hiddenAt = 0;
        var lastCheck = 0;

        function applyUpdate() {
          try {
            var K = 'osusowake_resume_reload_at';
            var last = Number(sessionStorage.getItem(K) || 0);
            if (Date.now() - last < 60000) return;
            sessionStorage.setItem(K, String(Date.now()));
          } catch (_) {}
          var u = new URL(window.location.href);
          u.searchParams.set('_v', String(Date.now()));
          window.location.replace(u.toString());
        }

        function checkForUpdate() {
          if (Date.now() - lastCheck < 5 * 60 * 1000) return;
          lastCheck = Date.now();
          fetch('/?_probe=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.text() : null; })
            .then(function (html) {
              if (!html) return;
              var m = html.match(/assets\/index-[A-Za-z0-9_-]+\.js/);
              if (m && m[0] !== running) applyUpdate();
            })
            .catch(function () {});
        }

        document.addEventListener('visibilitychange', function () {
          if (document.hidden) { hiddenAt = Date.now(); return; }
          if (hiddenAt && Date.now() - hiddenAt > 30000) checkForUpdate();
        });
      })();
    </script>
  </body>
